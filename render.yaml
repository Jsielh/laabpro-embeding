services:
  - type: web
    name: laabpro-api
    runtime: python
    region: ohio
    plan: free
    branch: main
    buildCommand: npm install -g pnpm && cd frontend && pnpm install && pnpm vite build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
